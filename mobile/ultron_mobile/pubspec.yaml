name: ultron_mobile
description: "Futuristic mobile HUD controller client for the ULTRON-AI laptop gateway."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.0.5
  speech_to_text: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
