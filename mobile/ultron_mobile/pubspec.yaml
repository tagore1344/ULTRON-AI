name: ultron_mobile
description: "TAG AI mobile assistant — Siri-style voice HUD for the ULTRON-AI gateway."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.0.5
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
