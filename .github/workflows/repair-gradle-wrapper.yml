name: Repair Android Gradle Wrapper

on:
  push:
    branches:
      - arena/019fef42-ultron-ai

permissions:
  contents: write

jobs:
  repair-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/019fef42-ultron-ai
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Regenerate wrapper
        working-directory: mobile/android
        run: gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Validate wrapper jar
        working-directory: mobile/android
        run: |
          test -s gradle/wrapper/gradle-wrapper.jar
          jar tf gradle/wrapper/gradle-wrapper.jar | grep -q 'org/gradle/wrapper/GradleWrapperMain.class'

      - name: Remove repair workflow
        run: rm -f .github/workflows/repair-gradle-wrapper.yml

      - name: Commit repaired wrapper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/android/gradle/wrapper/gradle-wrapper.jar mobile/android/gradle/wrapper/gradle-wrapper.properties mobile/android/gradlew mobile/android/gradlew.bat .github/workflows/repair-gradle-wrapper.yml
          git diff --cached --quiet || git commit -m 'fix: regenerate valid Gradle 8.2 wrapper'
          git push origin HEAD:arena/019fef42-ultron-ai
